name: Release

# Disparado à mão: um release é entrega, não algo para sair a cada push.
# Gera o AppImage, os pacotes do Windows e o DMG do macOS Intel em paralelo.
# Publica os arquivos e o SHA256SUMS quando os três builds passarem.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (em branco usa v<versão do main.cpp>)"
        required: false
        type: string
      prerelease:
        description: "Marcar como pré-lançamento"
        required: false
        default: false
        type: boolean

# Necessário para criar a release e subir os arquivos nela.
permissions:
  contents: write

jobs:
  linux:
    uses: ./.github/workflows/appimage.yml
    with:
      tag: ${{ inputs.tag }}

  windows:
    uses: ./.github/workflows/windows.yml

  macos:
    uses: ./.github/workflows/macos.yml

  publicar:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: omajim-*-x64
          path: dist
          merge-multiple: true

      # Acompanha os arquivos: é a forma de quem baixa conferir que chegaram
      # inteiros.
      - name: Calcula o SHA256
        run: |
          cd dist
          ls -la
          sha256sum omajim-* > SHA256SUMS
          cat SHA256SUMS

      # `gh` já vem no runner, então nada de terceiros para publicar. Uma
      # release que já exista é reaproveitada, com os arquivos substituídos.
      # A tag nasce no commit que foi compilado.
      - name: Publica na release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.linux.outputs.tag }}
          VERSAO: ${{ needs.linux.outputs.versao }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            extra=""
            [ "$PRERELEASE" = "true" ] && extra="--prerelease"
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Omajim $VERSAO" \
              --generate-notes \
              $extra
          fi
