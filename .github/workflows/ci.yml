name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Arch é a plataforma alvo (Omarchy) e traz as versões que o Omajim usa.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Instala as dependências
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git \
            qt6-base qt6-declarative qt6-wayland qt6-imageformats \
            qxmpp wayland wayland-protocols

      - uses: actions/checkout@v4

      - name: Testa
        run: ./bin/test

      - name: Compila
        run: ./bin/build

  # Compila e confere que o omajim.exe abre no Windows, sem gerar zip,
  # instalador nem artefatos (isso fica só no release.yml).
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      empacotar: false

  # Testa e compila no macOS Intel (com Qt e QXmpp em cache), sem gerar DMG nem artefato.
  macos:
    uses: ./.github/workflows/macos.yml
    with:
      empacotar: false
