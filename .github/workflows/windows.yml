name: Windows

# Build do Omajim para Windows x64, reaproveitado pelo workflow de release
# (que anexa o zip e o instalador). Compila com o MinGW do MSYS2, que traz o
# Qt 6 e a QXmpp atuais prontos, sem um segundo conjunto de dependências
# para compilar.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qxmpp

      - name: Compila
        run: |
          mkdir build
          cd build
          qmake6 ../omajim.pro
          mingw32-make -j"$(nproc)" release
          find . -name omajim.exe

      - name: Monta a pasta do pacote
        run: |
          versao="$(sed -n 's/.*setApplicationVersion("\([^"]*\)").*/\1/p' src/main.cpp)"
          pasta="omajim-$versao-windows-x64"
          exe="$(find build -name omajim.exe | head -n 1)"
          mkdir -p "dist/$pasta"
          cp "$exe" "dist/$pasta/"

          # Qt: plugins (plataforma, imagens, SQLite, TLS, ícones SVG), módulos
          # QML e as DLLs do próprio Qt.
          deploy="$(command -v windeployqt6 || command -v windeployqt-qt6 || command -v windeployqt)"
          "$deploy" --release --no-translations --qmldir src "dist/$pasta/omajim.exe"

          # Do SQL só o SQLite, o do histórico: os outros drivers ligam
          # clientes de banco que não vêm junto e só pesariam no pacote.
          find "dist/$pasta/sqldrivers" -name '*.dll' ! -name qsqlite.dll -delete

          # O que o windeployqt não conhece (QXmpp, o runtime do MinGW, as
          # dependências dos plugins) — só o que veio do MSYS2, nunca o
          # sistema. Também dos plugins: o de WebP liga a libwebp, por exemplo.
          find "dist/$pasta" -name '*.exe' -o -name '*.dll' | while read -r arquivo; do
            ldd "$arquivo" | awk '/ucrt64/ {print $3}'
          done | sort -u | while read -r dll; do
            cp -n "$dll" "dist/$pasta/"
          done

          # O TLS da QXmpp vai pelo Schannel do próprio Windows
          # (tls/qschannelbackend.dll), então nada de OpenSSL junto.

          # Sem isto o Qt deduz o prefixo de onde estão as DLLs e procura
          # plugins e módulos QML no lugar errado; com o qt.conf ele olha ao
          # lado do executável.
          printf '[Paths]\nPrefix = .\nBinaries = .\nPlugins = .\nImports = qml\nQmlImports = qml\n' \
              > "dist/$pasta/qt.conf"

          cp LICENSE README.md "dist/$pasta/"
          echo "PASTA=$pasta" >> "$GITHUB_ENV"

      - name: Confere que a interface carrega
        run: |
          # Abre de verdade, com o renderizador por software (o runner não
          # tem GPU): se o Main.qml não carregar o processo morre na hora; se
          # carregar, ele segue vivo até o timeout (124) o encerrar.
          #
          # Num ambiente limpo, de propósito: dentro do shell do MSYS2 o Qt
          # acharia plugins e QML em /ucrt64 e o teste passaria mesmo com um
          # pacote que não abre numa máquina sem o MSYS2.
          set +e
          env -i SYSTEMROOT="$SYSTEMROOT" USERNAME="$USERNAME" APPDATA="$APPDATA" \
              LOCALAPPDATA="$LOCALAPPDATA" USERPROFILE="$USERPROFILE" QT_QUICK_BACKEND=software \
              /usr/bin/timeout 15 "dist/$PASTA/omajim.exe"
          codigo=$?
          set -e
          if [ "$codigo" -ne 124 ]; then
            echo "A interface nao ficou de pe (codigo $codigo)." >&2
            exit 1
          fi

      - name: Gera o zip (portátil)
        run: |
          cd dist
          zip -qr "$PASTA.zip" "$PASTA"
          ls -la

      # O instalador pergunta a pasta (Arquivos de Programas por padrão) e
      # oferece os atalhos como opções. O Inno Setup vem do Chocolatey.
      - name: Gera o instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $versao = $env:PASTA -replace '^omajim-', '' -replace '-windows-x64$', ''
          $fonte = (Resolve-Path "dist/$env:PASTA").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$versao" "/DSourceDir=$fonte" "/Odist" packaging/windows/omajim.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Confere o instalador (instala, confere os atalhos, desinstala)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist -Filter *-setup.exe).FullName
          $destino = Join-Path $env:RUNNER_TEMP "omajim-instalado"
          $log = Join-Path $env:RUNNER_TEMP "instalador.log"
          # Os atalhos marcados, numa pasta escolhida.
          $p = Start-Process $setup -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$destino",
              "/TASKS=startmenuicon,desktopicon", "/LOG=$log")
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "instalador saiu com $($p.ExitCode)" }

          $falhou = $false
          foreach ($item in @(
              "$destino\omajim.exe",
              "$destino\platforms\qwindows.dll",
              "$destino\unins000.exe",
              "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Omajim.lnk",
              "$env:PUBLIC\Desktop\Omajim.lnk")) {
              if (Test-Path $item) { "ok: $item" } else { "FALTA: $item"; $falhou = $true }
          }
          if ($falhou) { Get-Content $log -Tail 40; throw "instalação incompleta" }

          $u = Start-Process "$destino\unins000.exe" -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          if ($u.ExitCode -ne 0) { throw "desinstalador saiu com $($u.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path "$destino\omajim.exe") { throw "o desinstalador deixou o executável" }
          "desinstalado"

      - uses: actions/upload-artifact@v4
        with:
          name: omajim-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7
